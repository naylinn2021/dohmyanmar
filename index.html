
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Myanmar Live TV - Android TV</title>

<style>
:root {
  --bg: #101827;
  --panel: #1c2839;
  --text: #f5f7fb;
  --muted: #b5c1d4;
  --accent: #29c78a;
  --border: #344358;
  --focus: #ffe082;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

header {
  padding: 26px 32px;
  background: #172438;
  border-bottom: 2px solid var(--border);
  text-align: center;
}

header h1 {
  font-size: clamp(26px, 3vw, 40px);
  margin: 0 0 8px;
}

header p {
  color: var(--muted);
  font-size: clamp(14px, 1.5vw, 20px);
  margin: 0;
}

main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 32px;
}

.panel {
  padding: 22px;
  background: var(--panel);
  border-radius: 18px;
  margin-bottom: 26px;
}

.controls {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr);
  gap: 14px;
}

input, select {
  width: 100%;
  min-height: 56px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: #101827;
  color: var(--text);
  outline: none;
}

#loadBtn {
  min-height: 56px;
  grid-column: 1 / -1;
}

.primary, .play-btn {
  background: var(--accent);
  color: #071b13;
}

.secondary {
  background: #344358;
  color: white;
}

button:disabled {
  opacity: 0.65;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
.channel:focus-visible {
  outline: 4px solid var(--focus);
  outline-offset: 4px;
  box-shadow: 0 0 0 7px rgba(255, 224, 130, 0.15);
}

button:focus-visible {
  transform: scale(1.025);
}

#status {
  margin-top: 16px;
  color: var(--muted);
  overflow-wrap: anywhere;
  font-size: 15px;
}

#status.success {
  color: #7ce7b6;
}

#status.error {
  color: #ff9b9b;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin: 28px 4px 18px;
}

.section-title h2 {
  font-size: clamp(21px, 2.3vw, 30px);
  margin: 0;
}

#count {
  color: var(--muted);
  text-align: right;
  font-size: 15px;
}

#channels {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 18px;
}

.channel {
  min-width: 0;
  padding: 18px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  text-align: center;
  align-items: stretch;
  transition: border-color 0.12s, background 0.12s;
}

.channel:focus-within {
  border-color: var(--focus);
  background: #24344a;
}

.logo-box {
  height: 120px;
  margin-bottom: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-box img {
  width: 100px;
  height: 100px;
  object-fit: contain;
  background: white;
  border-radius: 14px;
}

.logo-fallback {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #344358;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: bold;
}

.channel-name {
  min-height: 48px;
  font-size: 18px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.channel-group {
  margin: 4px 0 16px;
  color: var(--muted);
  font-size: 14px;
}

.play-btn {
  width: 100%;
  min-height: 54px;
  margin-top: auto;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

footer {
  padding: 26px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

/* TV မျက်နှာပြင်ကျယ် */
@media (min-width: 1500px) {
  #channels {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  main {
    padding-left: 44px;
    padding-right: 44px;
  }
}

/* ပုံမှန် Android TV / Box */
@media (min-width: 1000px) and (max-width: 1499px) {
  #channels {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

/* TV Box က Browser ကို 720p နဲ့ပြသတဲ့အခါ */
@media (min-width: 650px) and (max-width: 999px) {
  main {
    padding: 20px;
  }

  #channels {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .channel {
    padding: 13px;
  }

  .logo-box {
    height: 100px;
  }

  .logo-box img {
    width: 82px;
    height: 82px;
  }
}

/* ဖုန်းနဲ့လည်း အသုံးပြုနိုင်ရန် */
@media (max-width: 649px) {
  header {
    padding: 22px 12px;
  }

  main {
    padding: 12px;
  }

  .panel {
    padding: 14px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  #loadBtn {
    grid-column: auto;
  }

  #channels {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .channel {
    padding: 12px 9px;
  }

  .logo-box {
    height: 84px;
  }

  .logo-box img {
    width: 70px;
    height: 70px;
  }

  .channel-name {
    font-size: 15px;
  }

  .play-btn {
    font-size: 13px;
    padding: 10px 5px;
  }

  .section-title {
    align-items: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <h1>📺 Myanmar Live TV</h1>
  <p>Live Channels · News · Entertainment · Sports</p>
</header>

<main>
  <section class="panel">
    <div class="controls">
      <button id="loadBtn" class="primary" type="button">
        🔄 Load Channels
      </button>

      <input
        id="search"
        type="search"
        placeholder="🔎 Channel အမည် ရှာရန်..."
        aria-label="Channel ရှာရန်"
      >

      <select id="groupFilter" aria-label="Channel အမျိုးအစား">
        <option value="">အားလုံးသော အမျိုးအစားများ</option>
      </select>
    </div>

    <div id="status" role="status" aria-live="polite">
      Playlist ကို ဖတ်နေပါသည်...
    </div>
  </section>

  <div class="section-title">
    <h2>📡 Channel များ</h2>
    <span id="count">0 Channels</span>
  </div>

  <section id="channels">
    <div class="empty">Channel များကို ဖတ်နေပါသည်...</div>
  </section>
</main>

<footer>
  Myanmar Live TV
</footer>

<script>
"use strict";

const DEFAULT_PLAYLIST =
  "https://raw.githubusercontent.com/naylinn2021/dohmyanmar/main/doh_mm.m3u";

// မိမိ Android TV Box ရှိ Player package နှင့် ကိုက်ညီရပါမည်။
const PLAYER_PACKAGE = "com.genuine.leone";

const loadBtn = document.getElementById("loadBtn");
const searchInput = document.getElementById("search");
const groupFilter = document.getElementById("groupFilter");
const channelsBox = document.getElementById("channels");
const statusBox = document.getElementById("status");
const countBox = document.getElementById("count");

let allChannels = [];

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

function getAttribute(line, name) {
  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  const regex = new RegExp(
    "(?:^|\\s)" + escaped + '="([^"]*)"',
    "i"
  );

  const match = line.match(regex);
  return match ? match[1].trim() : "";
}

function parseM3U(text) {
  const lines = text
    .replace(/^\uFEFF/, "")
    .split(/\r?\n/);

  const result = [];
  let current = null;

  for (const rawLine of lines) {
    const line = rawLine.trim();

    if (!line) continue;

    if (line.startsWith("#EXTINF")) {
      const comma = line.indexOf(",");
      const metadata = comma >= 0
        ? line.slice(0, comma)
        : line;

      const displayName = comma >= 0
        ? line.slice(comma + 1).trim()
        : "";

      current = {
        name:
          displayName ||
          getAttribute(metadata, "tvg-name") ||
          "Unknown Channel",

        logo: getAttribute(metadata, "tvg-logo"),

        group:
          getAttribute(metadata, "group-title") ||
          "Other",

        url: ""
      };

      continue;
    }

    if (line.startsWith("#")) continue;

    if (/^(referer|http-user-agent|user-agent|cookie)\s*=/i.test(line)) {
      continue;
    }

    if (/^https?:\/\//i.test(line) && current) {
      current.url = line;
      result.push(current);
      current = null;
    }
  }

  return result;
}

function buildGroups() {
  const previous = groupFilter.value;

  const groups = [
    ...new Set(allChannels.map(channel => channel.group))
  ].sort((a, b) => a.localeCompare(b));

  groupFilter.replaceChildren();

  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "အားလုံးသော အမျိုးအစားများ";
  groupFilter.appendChild(allOption);

  for (const group of groups) {
    const option = document.createElement("option");
    option.value = group;
    option.textContent = group;
    groupFilter.appendChild(option);
  }

  if (groups.includes(previous)) {
    groupFilter.value = previous;
  }
}

function createFallback(name) {
  const fallback = document.createElement("div");
  fallback.className = "logo-fallback";
  fallback.textContent =
    (name || "TV").trim().charAt(0).toUpperCase() || "T";

  return fallback;
}

function makeChannelCard(channel) {
  const card = document.createElement("article");
  card.className = "channel";

  const logoBox = document.createElement("div");
  logoBox.className = "logo-box";

  if (channel.logo) {
    const img = document.createElement("img");

    img.src = channel.logo;
    img.alt = channel.name + " logo";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";

    img.addEventListener("error", () => {
      img.replaceWith(createFallback(channel.name));
    }, { once: true });

    logoBox.appendChild(img);
  } else {
    logoBox.appendChild(createFallback(channel.name));
  }

  const name = document.createElement("div");
  name.className = "channel-name";
  name.textContent = channel.name;

  const group = document.createElement("div");
  group.className = "channel-group";
  group.textContent = channel.group;

  const play = document.createElement("button");
  play.type = "button";
  play.className = "play-btn";
  play.textContent = "▶ Open in Player";
  play.setAttribute("aria-label", channel.name + " ကို ဖွင့်ရန်");

  play.addEventListener("click", () => {
    openExternalPlayer(channel.url);
  });

  // Copy Stream URL / Open Stream ခလုတ်များ မပါဝင်ပါ။
  card.append(logoBox, name, group, play);

  return card;
}

function openExternalPlayer(streamUrl) {
  try {
    const parsed = new URL(streamUrl);

    if (!["http:", "https:"].includes(parsed.protocol)) {
      setStatus("Stream URL အမျိုးအစား မမှန်ပါ။", "error");
      return;
    }

    const scheme = parsed.protocol.slice(0, -1);

    const intentUrl =
      "intent://" +
      streamUrl.replace(/^https?:\/\//i, "") +
      "#Intent;scheme=" + scheme +
      ";package=" + PLAYER_PACKAGE +
      ";action=android.intent.action.VIEW;end";

    setStatus(
      "Player ကို ဖွင့်ရန် ကြိုးစားနေပါသည်။ " +
      "မဖွင့်နိုင်ပါက Player App ကို စစ်ဆေးပါ။"
    );

    window.location.href = intentUrl;

  } catch (error) {
    console.error("Player error:", error);
    setStatus("Stream URL ကို ဖွင့်မရပါ။", "error");
  }
}

function renderChannels() {
  const query = searchInput.value.trim().toLowerCase();
  const selectedGroup = groupFilter.value;

  const filtered = allChannels.filter(channel => {
    const matchesName =
      channel.name.toLowerCase().includes(query);

    const matchesGroup =
      !selectedGroup || channel.group === selectedGroup;

    return matchesName && matchesGroup;
  });

  channelsBox.replaceChildren();

  countBox.textContent =
    filtered.length + " / " + allChannels.length + " Channels";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";

    empty.textContent = allChannels.length
      ? "ရှာဖွေထားသော Channel မတွေ့ပါ။"
      : "Channel များ မရှိသေးပါ။";

    channelsBox.appendChild(empty);
    return;
  }

  const fragment = document.createDocumentFragment();

  for (const channel of filtered) {
    fragment.appendChild(makeChannelCard(channel));
  }

  channelsBox.appendChild(fragment);
}

async function loadPlaylist() {
  loadBtn.disabled = true;
  loadBtn.textContent = "Loading...";

  setStatus("Playlist ကို ဖတ်နေပါသည်...");

  try {
    const response = await fetch(DEFAULT_PLAYLIST, {
      method: "GET",
      cache: "no-cache"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const text = await response.text();

    if (!text.trim().startsWith("#EXTM3U")) {
      throw new Error("ရရှိလာသောဖိုင်သည် M3U မဟုတ်ပါ။");
    }

    const parsedChannels = parseM3U(text);

    if (parsedChannels.length === 0) {
      throw new Error("ဖတ်လို့ရသော Channel မတွေ့ပါ။");
    }

    allChannels = parsedChannels;

    buildGroups();
    renderChannels();

    setStatus(
      "အောင်မြင်ပါသည်။ Channel " +
      allChannels.length + " ခု ဖတ်ပြီးပါပြီ။",
      "success"
    );

  } catch (error) {
    console.error("Playlist loading error:", error);

    if (error instanceof TypeError) {
      setStatus(
        "Playlist မဖတ်နိုင်ပါ။ အင်တာနက်၊ CORS ခွင့်ပြုချက် " +
        "သို့မဟုတ် Playlist Server ကို စစ်ပါ။",
        "error"
      );
    } else {
      setStatus("အမှား: " + error.message, "error");
    }

    if (allChannels.length === 0) {
      channelsBox.replaceChildren();

      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent =
        "Channel များ မပေါ်ပါ။ အမှားစာကို စစ်ဆေးပါ။";

      channelsBox.appendChild(empty);
      countBox.textContent = "0 Channels";
    }

  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = "🔄 Load Channels";
  }
}

/*
 TV Remote navigation:
 - Up / Down / Left / Right ဖြင့် focus ရွှေ့ရန်
 - OK / Enter ဖြင့် ရွေးချယ်ရန်
 - Input ထဲတွင် စာရိုက်နေစဉ် arrow keys ကို မတားရန်
*/
document.addEventListener("keydown", event => {
  const active = document.activeElement;
  const tag = active ? active.tagName : "";

  const isTyping =
    tag === "INPUT" ||
    tag === "TEXTAREA";

  if (isTyping) {
    if (event.key === "Escape") {
      active.blur();
    }
    return;
  }

  if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
    return;
  }

  const focusables = [
    ...document.querySelectorAll(
      "button:not(:disabled), select, input"
    )
  ].filter(element => element.getClientRects().length > 0);

  if (!focusables.length) return;

  const currentIndex = focusables.indexOf(active);

  if (currentIndex < 0) {
    event.preventDefault();
    focusables[0].focus();
    return;
  }

  const current = focusables[currentIndex];
  const currentRect = current.getBoundingClientRect();

  let best = null;
  let bestScore = Infinity;

  for (const candidate of focusables) {
    if (candidate === current) continue;

    const rect = candidate.getBoundingClientRect();
    const dx = rect.left + rect.width / 2 -
      (currentRect.left + currentRect.width / 2);
    const dy = rect.top + rect.height / 2 -
      (currentRect.top + currentRect.height / 2);

    let primary;
    let secondary;

    if (event.key === "ArrowRight" && dx > 2) {
      primary = dx;
      secondary = Math.abs(dy);
    } else if (event.key === "ArrowLeft" && dx < -2) {
      primary = -dx;
      secondary = Math.abs(dy);
    } else if (event.key === "ArrowDown" && dy > 2) {
      primary = dy;
      secondary = Math.abs(dx);
    } else if (event.key === "ArrowUp" && dy < -2) {
      primary = -dy;
      secondary = Math.abs(dx);
    } else {
      continue;
    }

    const score = primary + secondary * 1.7;

    if (score < bestScore) {
      bestScore = score;
      best = candidate;
    }
  }

  if (best) {
    event.preventDefault();
    best.focus();
    best.scrollIntoView({
      behavior: "smooth",
      block: "nearest",
      inline: "nearest"
    });
  }
});

loadBtn.addEventListener("click", loadPlaylist);
searchInput.addEventListener("input", renderChannels);
groupFilter.addEventListener("change", renderChannels);

// TV Browser ဖွင့်သည်နှင့် Playlist ကို အလိုအလျောက်ဖတ်ပါ။
loadPlaylist();
</script>

</body>
</html>
